name: cpf-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cpf
      POSTGRES_PASSWORD: cpf_local_dev
      POSTGRES_DB: cpf
    ports:
      - "5432:5432"
    volumes:
      - cpf-pgdata:/var/lib/postgresql/data
      - ./packages/db/migrations:/docker-entrypoint-initdb.d:ro
      - ./packages/db/local-dev/zz-local-dev-role.sql:/docker-entrypoint-initdb.d/zz-local-dev-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpf -d cpf"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

volumes:
  cpf-pgdata:
