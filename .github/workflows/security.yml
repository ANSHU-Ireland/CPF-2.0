name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (full history secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check dependency review support
        id: dependency-review-support
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          url = (
              f"{os.environ['GITHUB_API_URL']}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/dependency-graph/compare/"
              f"{os.environ['BASE_SHA']}...{os.environ['HEAD_SHA']}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "User-Agent": "github-actions-dependency-review-preflight",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          status = None
          body = ""

          try:
              with urllib.request.urlopen(request) as response:
                  status = response.status
                  body = response.read().decode()
          except urllib.error.HTTPError as error:
              status = error.code
              body = error.read().decode()

          message = body
          try:
              message = json.loads(body).get("message", body)
          except json.JSONDecodeError:
              pass

          max_error_message_length = 200
          output_path = os.environ.get("GITHUB_OUTPUT")
          if not output_path:
              raise SystemExit("GITHUB_OUTPUT is not set")

          with open(output_path, "a", encoding="utf-8") as output:
              if status == 200:
                  output.write("supported=true\n")
                  print("Dependency review API is available for this repository.")
              elif status in {403, 404, 422}:
                  # Fixed (Delivery Plan Step 50, real CI defect found and
                  # fixed): GitHub does not guarantee stable message text
                  # when dependency-graph support is unavailable for a
                  # repository (observed in practice: a bare "Forbidden"
                  # body with no matching marker string) -- any 403/404/422
                  # here means "can't run dependency review", so skip it
                  # gracefully rather than failing the whole security
                  # workflow over an optional, best-effort check.
                  output.write("supported=false\n")
                  print(
                      "::notice::Skipping dependency review -- the "
                      f"dependency-graph API returned {status}: "
                      f"{message[:max_error_message_length]}"
                  )
              else:
                  print(
                      "Dependency review preflight failed with status "
                      f"{status}: {message[:max_error_message_length]}"
                  )
                  raise SystemExit(
                      f"Unexpected dependency review preflight response: {status}"
                  )
          PY

      - name: Dependency review
        if: steps.dependency-review-support.outputs.supported == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
