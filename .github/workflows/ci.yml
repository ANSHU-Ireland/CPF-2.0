name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Regenerate OpenAPI spec and fail on drift (CPF-44)
        run: |
          npm run openapi:generate -w @cpf/api
          git diff --exit-code -- docs/api/openapi.json

      - name: Generate seed (validates framework data → SQL pipeline)
        run: npm run seed:generate

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cpf
          POSTGRES_PASSWORD: cpf_ci
          POSTGRES_DB: cpf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cpf -d cpf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: |
          for f in packages/db/migrations/*.sql; do
            echo "Applying $f"
            PGPASSWORD=cpf_ci psql -h localhost -U cpf -d cpf -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Generate and apply seed
        run: |
          npm run seed:generate
          PGPASSWORD=cpf_ci psql -h localhost -U cpf -d cpf -v ON_ERROR_STOP=1 -f packages/db/seed/generated/seed.sql

      - name: Integration tests (full journeys, tenant isolation, audit chain, erasure, MFA)
        env:
          # Admin for provisioning; restricted cpf_api role for the app under test
          DATABASE_ADMIN_URL: postgresql://cpf:cpf_ci@localhost:5432/cpf
          DATABASE_URL: postgresql://cpf_api:cpf_local_dev@localhost:5432/cpf
        run: npm test

      - name: Verify seed and tenant isolation defaults
        run: |
          PGPASSWORD=cpf_ci psql -h localhost -U cpf -d cpf -v ON_ERROR_STOP=1 -c "
            DO \$\$
            DECLARE n int;
            BEGIN
              SELECT count(*) INTO n FROM assessment_template_versions;
              IF n <> 10 THEN RAISE EXCEPTION 'expected 10 template versions, found %', n; END IF;
            END \$\$;"
          # RLS must be enabled on every tenant table
          PGPASSWORD=cpf_ci psql -h localhost -U cpf -d cpf -v ON_ERROR_STOP=1 -c "
            DO \$\$
            DECLARE bad text;
            BEGIN
              SELECT string_agg(tablename, ', ') INTO bad
              FROM pg_tables t
              WHERE schemaname = 'public'
                AND tablename IN ('candidates','invitations','assessment_sessions','evidence_events','reviews','criterion_scores','evidence_ledger_claims','data_rights_requests')
                AND NOT EXISTS (
                  SELECT 1 FROM pg_class c WHERE c.relname = t.tablename AND c.relrowsecurity
                );
              IF bad IS NOT NULL THEN RAISE EXCEPTION 'RLS disabled on: %', bad; END IF;
            END \$\$;"

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cpf
          POSTGRES_PASSWORD: cpf_ci
          POSTGRES_DB: cpf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cpf -d cpf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations + create cpf_api role
        run: |
          for f in packages/db/migrations/*.sql; do
            echo "Applying $f"
            PGPASSWORD=cpf_ci psql -h localhost -U cpf -d cpf -v ON_ERROR_STOP=1 -f "$f"
          done
          PGPASSWORD=cpf_ci psql -h localhost -U cpf -d cpf -v ON_ERROR_STOP=1 -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'cpf_api') THEN
                CREATE ROLE cpf_api LOGIN PASSWORD 'cpf_ci_api' IN ROLE cpf_app;
              END IF;
            END \$\$;"

      - name: Build the API production image (apps/api/Dockerfile, Step 31)
        run: docker build -f apps/api/Dockerfile -t cpf-api:ci .

      - name: Run the image and smoke-test /health
        run: |
          docker run -d --name cpf-api-ci \
            --network host \
            -e NODE_ENV=production \
            -e API_HOST=0.0.0.0 \
            -e API_PORT=4000 \
            -e DATABASE_URL=postgresql://cpf_api:cpf_ci_api@localhost:5432/cpf \
            cpf-api:ci
          for i in $(seq 1 20); do
            body="$(curl -fs http://localhost:4000/health || true)"
            if [ -n "$body" ]; then
              echo "$body"
              case "$body" in
                *'"mode":"platform"'*) echo "API is healthy in platform mode"; exit 0 ;;
                *) echo "Unexpected /health body (not platform mode): $body"; docker logs cpf-api-ci; exit 1 ;;
              esac
            fi
            echo "Waiting for API to become healthy... (attempt $i)"
            sleep 2
          done
          echo "API did not become healthy in time"
          docker logs cpf-api-ci
          exit 1

      - name: Dump container logs on failure
        if: failure()
        run: docker logs cpf-api-ci || true
